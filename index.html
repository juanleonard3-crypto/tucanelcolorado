<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuco · voz y cuerpo conectados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Bangers&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --glass:rgba(12,24,22,.46);--edge:rgba(255,255,255,.2);--ink:#f5fff9;--soft:rgba(245,255,249,.68)}
:root[data-theme="light"]{--glass:rgba(255,255,255,.4);--edge:rgba(255,255,255,.6);--ink:#10241c;--soft:rgba(16,36,28,.7)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--glass:rgba(12,24,22,.46)}}
html,body{height:100%;margin:0;overflow:hidden;background:#0b3d2a;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--edge);box-shadow:0 10px 40px rgba(0,0,0,.28)}
#bubble{position:fixed;left:0;top:0;z-index:5;max-width:min(270px,72vw);padding:12px 16px;background:#fffdf4;color:#1a1208;
 border:3px solid #1a1208;border-radius:24px;box-shadow:5px 5px 0 rgba(0,0,0,.35);font-size:15px;line-height:1.3;font-weight:500;
 opacity:0;transform:translate(-50%,-100%) scale(.85);transition:opacity .25s,scale .25s;pointer-events:none}
#bubble::after{content:"";position:absolute;left:50%;bottom:-17px;width:20px;height:20px;background:#fffdf4;border-right:3px solid #1a1208;border-bottom:3px solid #1a1208;transform:translateX(-50%) rotate(45deg) skew(8deg,8deg)}
#bubble.on{opacity:1}
#msgs::-webkit-scrollbar,#log::-webkit-scrollbar{width:4px}
#msgs::-webkit-scrollbar-thumb,#log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:4px}
.tab{transition:all .25s}.tab.act{background:rgba(255,255,255,.92);color:#0c2a1f}
.bar{width:3px;border-radius:2px;background:#ff9f1c;height:4px;transition:height .08s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#panel{transition:opacity .28s ease,transform .28s ease}
#panel.min{opacity:0;transform:translateY(24px) scale(.97);pointer-events:none}
#fab{transition:opacity .28s ease,transform .28s ease,background .2s}
#fab.hide{opacity:0;transform:scale(.6);pointer-events:none}
#fab:hover{background:rgba(255,255,255,.22)}
body:not(.debug) #panel,body:not(.debug) #fab,body:not(.debug) #bubble{display:none!important}
#talk{transition:transform .2s,background .2s}#talk:hover{transform:scale(1.06)}
body[data-live] #talk{background:rgba(255,159,28,.38);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,159,28,.55)}100%{box-shadow:0 0 0 18px rgba(255,159,28,0)}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bubble"></div>

<header class="fixed left-0 right-0 top-0 z-10 flex justify-center px-3" style="padding-top:calc(env(safe-area-inset-top,0px) + 10px)">
  <nav id="tabs" class="glass rounded-full p-1 flex gap-1 text-[13px] font-medium"></nav>
</header>
<div id="cta" class="fixed z-20 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2" style="bottom:calc(18px + env(safe-area-inset-bottom,0px))">
  <button id="talk" aria-label="Hablar con Tuco" class="glass w-16 h-16 rounded-full grid place-items-center text-2xl">🎙</button>
  <span id="vstat" class="glass rounded-full px-3 py-1 text-xs whitespace-nowrap" style="color:var(--soft)">Tocá para hablar con Tuco</span>
</div>

<aside id="panel" class="fixed z-10 right-3 left-3 md:left-auto md:right-5 md:top-5 md:w-[380px] bottom-3 flex flex-col gap-3 md:bottom-5" style="margin-bottom:env(safe-area-inset-bottom,0px)">
  <section class="glass rounded-3xl p-3 hidden md:block">
    <div class="flex items-center justify-between text-xs mb-2" style="color:var(--soft)">
      <span class="flex items-center gap-2"><i id="dot" class="inline-block w-2 h-2 rounded-full bg-emerald-400"></i>Consola ElevenLabs</span>
      <span>agente: Tuco</span>
    </div>
    <div id="wave" class="flex items-end gap-[3px] h-7 mb-2"></div>
    <div id="log" class="h-20 overflow-y-auto font-mono text-[11px] leading-snug" style="color:var(--soft)"></div>
  </section>
  <section class="glass rounded-3xl flex flex-col overflow-hidden relative h-[42vh] md:h-[420px]">
    <button id="minbtn" aria-label="Minimizar panel" title="Minimizar" class="absolute top-2 right-2 z-10 w-8 h-8 rounded-full grid place-items-center" style="background:rgba(255,255,255,.14);border:1px solid var(--edge)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="msgs" class="flex-1 overflow-y-auto p-4 pt-11 flex flex-col gap-2 text-sm"></div>
    <div id="chips" class="px-3 pb-2 flex gap-2 overflow-x-auto text-xs"></div>
    <div class="p-3 pt-1 flex gap-2">
      <input id="inp" autocomplete="off" placeholder="Preguntale a Tuco sobre El Colorado…" class="flex-1 min-w-0 rounded-2xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-orange-300" style="background:rgba(255,255,255,.14);color:var(--ink);border:1px solid var(--edge)">
      <button id="send" class="rounded-2xl px-4 font-semibold text-sm" style="background:#ff9f1c;color:#2a1600" aria-label="Enviar">Enviar</button>
    </div>
  </section>
</aside>

<button id="fab" class="glass hide fixed z-20 w-12 h-12 rounded-full grid place-items-center" style="right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))" aria-label="Abrir chat y consola" aria-expanded="false" title="Abrir chat">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  <i id="fabdot" class="hidden absolute top-1.5 right-1.5 w-3 h-3 rounded-full" style="background:#ff9f1c;border:2px solid rgba(0,0,0,.35)"></i>
</button>
<script>
/* ---------- Config de lugares ---------- */
const L={
 plaza:{n:'Plaza San Martín',x:-16,bg:0x0b3d2a,grid:0x4ade80,rim:0x8fdcff,fog:.022},
 camping:{n:'Camping Municipal',x:0,bg:0x7a3f26,grid:0xf0a46a,rim:0xffc65a,fog:.05},
 parque:{n:'Parque Acuático',x:16,bg:0x0b8fb0,grid:0x8ff4ff,rim:0xc8f6ff,fog:.024}
};
let cur='plaza';

/* ---------- Escena ---------- */
const cv=document.getElementById('gl');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1;
const S=new THREE.Scene();
S.background=new THREE.Color(L.plaza.bg);S.fog=new THREE.FogExp2(L.plaza.bg,L.plaza.fog);
const cam=new THREE.PerspectiveCamera(42,1,.1,300);

/* Luces */
S.add(new THREE.AmbientLight(0xbfd4ff,.35));
S.add(new THREE.HemisphereLight(0xdff0ff,0x203040,.55));
const key=new THREE.DirectionalLight(0xfff0cf,2.1);
key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.radius=5;key.shadow.bias=-.0005;
Object.assign(key.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:40});
S.add(key,key.target);
const rim=new THREE.DirectionalLight(0x8fdcff,2.2);S.add(rim,rim.target);

/* Suelo + grilla infinita (se pierde en la niebla) */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x0a3323,roughness:.95}));
ground.material.transparent=true;ground.material.opacity=.4;ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
const grid=new THREE.GridHelper(500,250,0xffffff,0xffffff);
grid.position.y=.012;grid.material.transparent=true;grid.material.opacity=.38;S.add(grid);

/* ---------- Tucán (modelo basado en referencias) ---------- */
const T=new THREE.Group();S.add(T);T.position.x=L.plaza.x;
const mat=(c,r=.5,m=.05,x={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},x));
const black=mat(0x0b0b12,.4,.2),wingM=mat(0x12121c,.38,.25),gray=mat(0x5d6972,.9,0),claw=mat(0x15151a,.5,.1);
const add=(p,g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o};
const ss=THREE.MathUtils.smoothstep;
const paint=(g,f)=>{const p=g.attributes.position,c=[],col=new THREE.Color();for(let i=0;i<p.count;i++){f(col,p.getX(i),p.getY(i),p.getZ(i));c.push(col.r,col.g,col.b)}g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));return g};
const vcol=mat(0xffffff,.7,0,{vertexColors:true});

// Cuerpo inclinado hacia adelante, como en las fotos
const BODY=new THREE.Group();BODY.position.set(0,.42,-.05);BODY.rotation.x=.3;T.add(BODY);
const prof=[[0,0],[.28,.04],[.6,.32],[.74,.78],[.66,1.22],[.48,1.58],[.4,1.85],[.22,2.05]].map(p=>new THREE.Vector2(p[0],p[1]));
add(BODY,new THREE.LatheGeometry(prof,44),black,0,.15,0);
// Garganta blanca que baja a pecho amarillo
add(BODY,paint(new THREE.SphereGeometry(.5,40,30),(c,x,y)=>{const t=(y/.5+1)/2;c.setRGB(1,.87,.38).lerp(new THREE.Color(1,1,.95),ss(t,.35,.7))}),vcol,0,1.3,.4).scale.set(1,1.7,.85);
// Cola larga con subcola naranja
const tail=add(BODY,new THREE.ConeGeometry(.3,1.5,28),black,0,.4,-.8);tail.scale.set(1.5,1,.4);tail.rotation.x=-(Math.PI/2+.75);
add(BODY,new THREE.SphereGeometry(.24,20,14),mat(0xff5a14,.6,0),0,.3,-.55).scale.set(1.5,.6,1);
// Patas grises con garras y rama
const foot=x=>{
  add(T,new THREE.CylinderGeometry(.045,.06,.58,12),gray,x,.33,.05);
  [[-.5,.3],[0,.34],[.5,.3],[Math.PI,.2]].forEach(([a,l])=>{
    const g=new THREE.Group();g.position.set(x,.13,.05);g.rotation.y=a;T.add(g);
    const t=add(g,new THREE.CylinderGeometry(.028,.034,l,8),gray,0,0,l/2);t.rotation.x=Math.PI/2;
    const c=add(g,new THREE.ConeGeometry(.036,.1,8),claw,0,-.01,l+.04);c.rotation.x=Math.PI/2;});
};
[-.24,.24].forEach(foot);
const br=add(T,new THREE.CylinderGeometry(.09,.11,5,12),mat(0x5b3a22,.95,0),0,.02,.1);br.rotation.z=Math.PI/2;

// Cabeza
const H=new THREE.Group();H.position.set(0,2.2,.05);BODY.add(H);
add(H,new THREE.SphereGeometry(.56,40,30),black).scale.set(1,1,1.08);

// Parche naranja y ojos azul oscuro con parpadeo
const eyes=[];
[-1,1].forEach(s=>{
  const pa=add(H,new THREE.SphereGeometry(.3,24,18),mat(0xff7a0a,.6,0),s*.34,.1,.37);pa.scale.set(1,1.1,.4);pa.rotation.y=s*.6;
  const e=new THREE.Group();e.position.set(s*.37,.12,.4);e.rotation.y=s*.6;H.add(e);
  add(e,new THREE.TorusGeometry(.15,.04,14,36),mat(0x5ab4ff,.3,0,{emissive:0x2a8ae0,emissiveIntensity:.8}),0,0,.02);
  add(e,new THREE.SphereGeometry(.15,24,18),mat(0x05060a,.1,.3),0,0,.02).scale.set(1,1,.6);
  add(e,new THREE.SphereGeometry(.03,10,8),new THREE.MeshBasicMaterial({color:0xffffff}),.05,.06,.13);
  eyes.push(e);
});

// Pico grande: naranja→amarillo, cresta roja, base y punta negras
function jaw(w,h,len,curve,up){
  const g=new THREE.SphereGeometry(1,44,26),p=g.attributes.position,c=[],col=new THREE.Color(),K=new THREE.Color(.04,.035,.035);
  const A=new THREE.Color(1,.46,.04),B=new THREE.Color(1,.64,.08),RD=new THREE.Color(.9,.1,.04),O=new THREE.Color(1,.3,.04),L0=new THREE.Color(1,.38,.05),L1=new THREE.Color(.86,.13,.05);
  for(let i=0;i<p.count;i++){
    const ux=p.getX(i),uy=p.getY(i),t=(p.getZ(i)+1)/2,tp=1-.6*t;
    p.setXYZ(i,ux*w*tp,uy*h*tp-curve*t*t,t*len);
    if(up){col.copy(A).lerp(B,ss(t,.2,.95));
      col.lerp(RD,ss(uy,.2,.8)*(1-ss(t,.6,.97))*.95);
      col.lerp(O,ss(-uy,.3,.9)*.35);
      col.lerp(K,1-ss(t,.03,.1)).lerp(K,ss(t,.83,.93));}
    else{col.copy(L0).lerp(L1,t);col.lerp(K,1-ss(t,.03,.1)).lerp(K,ss(t,.94,.99)*.9)}
    c.push(col.r,col.g,col.b);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));g.computeVertexNormals();return g;
}
const bm=mat(0xffffff,.3,.06,{vertexColors:true});
const B=new THREE.Group();B.position.set(0,-.02,.42);B.rotation.x=-.32;H.add(B);
const upP=new THREE.Group(),loP=new THREE.Group();upP.position.y=.06;loP.position.y=-.1;B.add(upP,loP);
add(upP,jaw(.34,.3,1.9,.42,true),bm,0,.05,0);
add(loP,jaw(.27,.15,1.6,.28,false),bm,0,-.02,0);

// Alas plegadas con capas de plumas (pivote en el hombro)
const wings=[-1,1].map(s=>{
  const p=new THREE.Group();p.position.set(s*.6,1.65,-.05);BODY.add(p);
  [[.2,1.5,.62,.05,-.78,-.1],[.14,1.2,.5,.1,-.9,-.22],[.1,.9,.4,.13,-1,-.3]].forEach(([sx,sy,sz,x,y,z],i)=>{
    const w=add(p,new THREE.SphereGeometry(.5,28,20),i?wingM:black,s*x,y,z);w.scale.set(sx,sy,sz)});
  p.userData.s=s;return p;
});

/* ---------- Partículas ---------- */
const mk=d=>{const c=document.createElement('canvas');c.width=c.height=64;d(c.getContext('2d'));return new THREE.CanvasTexture(c)};
const leafT=mk(g=>{g.translate(32,32);g.rotate(-.7);g.fillStyle='#8cf5a0';g.beginPath();g.ellipse(0,0,10,26,0,0,7);g.fill();g.strokeStyle='#1c6b3a';g.lineWidth=2;g.beginPath();g.moveTo(0,-24);g.lineTo(0,24);g.stroke()});
const bubT=mk(g=>{const r=g.createRadialGradient(32,32,16,32,32,29);r.addColorStop(0,'rgba(255,255,255,.04)');r.addColorStop(.85,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,.9)');g.fillStyle=r;g.beginPath();g.arc(32,32,29,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(23,22,5,0,7);g.fill()});
const mistT=mk(g=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
function pts(cx,n,tex,size,color,op,sp){
  const g=new THREE.BufferGeometry(),a=new Float32Array(n*3);
  for(let i=0;i<n;i++){a[i*3]=cx+(Math.random()-.5)*sp;a[i*3+1]=Math.random()*9;a[i*3+2]=(Math.random()-.7)*12}
  g.setAttribute('position',new THREE.BufferAttribute(a,3));
  const m=new THREE.PointsMaterial({map:tex,size,color,transparent:true,opacity:0,depthWrite:false,sizeAttenuation:true});
  const p=new THREE.Points(g,m);p.userData={cx,op,sp};S.add(p);return p;
}
const P={plaza:pts(-16,110,leafT,.65,0xffffff,.95,16),camping:pts(0,45,mistT,7,0xe6b38a,.38,18),parque:pts(16,120,bubT,.55,0xffffff,.9,16)};

/* ---------- UI: pestañas y chips ---------- */
const tabs=document.getElementById('tabs'),chips=document.getElementById('chips');
Object.entries(L).forEach(([k,v])=>{
  const b=document.createElement('button');b.className='tab rounded-full px-3.5 py-1.5 whitespace-nowrap';b.textContent={plaza:'Plaza',camping:'Camping',parque:'Parque acuático'}[k];b.dataset.k=k;
  b.onclick=()=>{go(k);if(V.connected&&conv)conv.sendUserMessage('Contame qué puedo hacer en '+L[k].n)};tabs.appendChild(b);
});
['¿Qué hago en la plaza?','Quiero ir al río','¿Y el parque acuático?','¿Quién ganó el mundial?'].forEach(t=>{
  const b=document.createElement('button');b.className='shrink-0 rounded-full px-3 py-1.5';b.style.cssText='background:rgba(255,255,255,.14);border:1px solid var(--edge)';
  b.textContent=t;b.onclick=()=>ask(t);chips.appendChild(b);
});
function paintTabs(){[...tabs.children].forEach(b=>b.classList.toggle('act',b.dataset.k===cur))}paintTabs();
const wave=document.getElementById('wave');for(let i=0;i<34;i++){const d=document.createElement('i');d.className='bar';wave.appendChild(d)}

/* ---------- Cerebro de Tuco (solo turismo de El Colorado) ---------- */
const INFO={
 plaza:'¡Epa, che! Estamos en la Plaza San Martín, el corazón del pueblo. Sombra de palmeras, tereré bien helado y charla de vereda. ¡Mirá vos qué lindo! 🌴',
 camping:'¡Al toque, chamigo! Camping Municipal, con el Río Bermejo de vecino: carpa, fogón, pesca y atardeceres que te dejan sin palabras. Llevá repelente, ¿eh? 🔥',
 parque:'¡Zambullite, che! El Parque Acuático es salvación contra el calor formoseño. Pileta, risas y mucho chapoteo. ¡Y no te olvides el protector! 💦'
};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const RULES=[
 {k:['plaza','san martin','centro','palmera','hojas'],go:'plaza',t:INFO.plaza},
 {k:['camping','bermejo','rio','pesca','pescar','carpa','acampar','fogon','asado'],go:'camping',t:INFO.camping},
 {k:['parque','acuatico','pileta','nadar','agua','burbuja','calor','refrescar'],go:'parque',t:INFO.parque},
 {k:['terere','comida','comer','chipa','mate','empanada'],t:'¡Ahí hablaste, pichón! En El Colorado el tereré no falta: bien helado, con yuyos, en rueda de amigos. Una chipa calentita al lado y listo el paseo. ¿Lo tomamos en la plaza? 🧉'},
 {k:['clima','tiempo','lluvia','temperatura','sol'],t:'Acá el sol pega fuerte, che: gorra, protector y agua a mano. Lo mejor es salir temprano o al atardecer. ¿Te sugiero un lugar fresquito? ☀️'},
 {k:['hola','buenas','buen dia','buenas tardes','que tal','hey','ola'],t:'¡Epa, qué hacés, viajero! Soy Tuco, tu guía en El Colorado. Preguntame por la Plaza San Martín, el Camping Municipal o el Parque Acuático. 🦜'},
 {k:['ayuda','quien sos','que haces','que podes','como funciona'],t:'Soy Tuco, el tucán más charlatán del pueblo. Te cuento qué hacer en la Plaza San Martín, el Camping Municipal y el Parque Acuático. ¡Preguntá nomás!'}
];
const NO=[
 '¡Uy, pichón! De eso no entiendo ni jota: mi pico solo sabe de turismo de El Colorado. ¿Te cuento del Río Bermejo mejor? 🦜',
 '¡Ja! Buena la pregunta, pero me pasaste de largo. Yo hablo de plazas, ríos y pileta en El Colorado. ¿Vamos a alguno? 😄',
 'Eso queda fuera de mi territorio, chamigo. Mi especialidad: paseos coloradenses. ¿Plaza, camping o parque acuático?',
 '¡Mba’e! Si me preguntás eso me quedo mudo… y un tucán mudo es un desperdicio de pico. Hablemos de turismo local. 🧉'
];
function reply(q){
  const n=norm(q);for(const r of RULES){if(r.k.some(w=>n.includes(w)))return r}
  return {t:NO[Math.floor(Math.random()*NO.length)]};
}

/* ---------- Chat + habla ---------- */
const msgs=document.getElementById('msgs'),inp=document.getElementById('inp'),bub=document.getElementById('bubble'),logEl=document.getElementById('log'),dot=document.getElementById('dot');
function msg(t,me){const d=document.createElement('div');d.className='max-w-[88%] rounded-2xl px-3.5 py-2 '+(me?'self-end':'self-start');
  d.style.cssText=me?'background:#ff9f1c;color:#2a1600':'background:rgba(255,255,255,.16);border:1px solid var(--edge)';d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;if(document.getElementById('panel').classList.contains('min'))document.getElementById('fabdot').classList.remove('hidden')}
function log(t){const d=document.createElement('div');d.textContent=t;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;while(logEl.children.length>30)logEl.firstChild.remove()}
let speakUntil=0,typeTimer,hideTimer;
function say(text){
  msg(text,false);const dur=text.length*.052+.5,now=performance.now()/1000;speakUntil=now+dur;
  clearInterval(typeTimer);clearTimeout(hideTimer);bub.textContent='';bub.classList.add('on');let i=0;
  typeTimer=setInterval(()=>{bub.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(typeTimer);hideTimer=setTimeout(()=>bub.classList.remove('on'),5000)}},dur*1000/text.length);
  log('→ POST /v1/text-to-speech/tuco  model=eleven_multilingual_v2');
  setTimeout(()=>log('← 200 audio/mpeg  '+dur.toFixed(1)+'s  chars='+text.length),350);
}

const BG={};
const sm=k=>{k=Math.max(0,Math.min(1,k));return k*k*(3-2*k)};
const edgeTex=(()=>{const n=128,c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d'),d=g.createImageData(n,n);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=Math.round(255*sm(Math.min(x,n-1-x,y,n-1-y)/(n*.12))),i=(y*n+x)*4;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  g.putImageData(d,0,0);return new THREE.CanvasTexture(c)})();
function setBackdrop(id,tex){
  let b=BG[id];
  if(!b){b={mesh:new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({transparent:true,opacity:0,alphaMap:edgeTex,fog:false,toneMapped:false,depthWrite:false}))};
    b.mesh.visible=false;b.mesh.renderOrder=-1;S.add(b.mesh);BG[id]=b}
  b.mesh.material.map=tex;b.mesh.material.needsUpdate=true;
  const a=tex.image.width/tex.image.height,h=14.5;
  b.mesh.scale.set(h*a,h,1);b.mesh.position.set(L[id].x,2.3,-10);
}
const texLoader=new THREE.TextureLoader();
Object.keys(IMG).forEach(id=>texLoader.load(IMG[id],t=>{setBackdrop(id,t);log('🖼 '+IMG[id]+' cargada')},undefined,()=>{}));
function fromFile(f,id){
  if(!f||!f.type.startsWith('image/'))return;
  texLoader.load(URL.createObjectURL(f),t=>{setBackdrop(id,t);log('🖼 foto aplicada a '+L[id].n)});
}
const fileIn=document.createElement('input');fileIn.type='file';fileIn.accept='image/*';
fileIn.onchange=()=>{fromFile(fileIn.files[0],cur);fileIn.value=''};
const ib=document.getElementById('imgbtn');if(ib)ib.onclick=()=>fileIn.click();
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();fromFile(e.dataTransfer.files[0],cur)});

if(/[?&]debug/.test(location.search))document.body.classList.add('debug');

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime,k=1-Math.exp(-dt*2.2),cfg=L[cur];
  const mobile=innerWidth<768;

  // Lerp de posición + física de inclinación
  const px=T.position.x;T.position.x+=(cfg.x-px)*k;
  vel+=((T.position.x-px)/Math.max(dt,.001)-vel)*Math.min(dt*8,1);
  T.position.y=Math.sin(t*1.6)*.05;
  T.rotation.z=THREE.MathUtils.clamp(-vel*.035,-.45,.45);
  T.rotation.y=.72+THREE.MathUtils.clamp(vel*.05,-.7,.7)+Math.sin(t*.6)*.1;
  const flap=Math.min(.9,Math.abs(vel)*.09);
  wings.forEach(w=>{w.rotation.z=w.userData.s*(.12+Math.sin(t*(Math.abs(vel)>.5?16:2))*(.04+flap)+flap*.6+(w.userData.s<0?V.fl:V.fr))});

  // Habla (lipsync con Math.sin)
  const now=performance.now()/1000,talk=V.connected?V.talking:now<speakUntil;
  if(V.connected){voiceFrame(t,dt)}else{
    const open=talk?(Math.sin(t*19)*.5+.5)*(Math.sin(t*6)*.3+.7)*.38:0;
    loP.rotation.x+=(open-loP.rotation.x)*.45;upP.rotation.x+=(-open*.25-upP.rotation.x)*.45;
    H.rotation.x=talk?Math.sin(t*9)*.05:Math.sin(t*1.1)*.02;H.rotation.z*=.9;V.fl*=.9;V.fr*=.9;V.brow*=.9;
    H.rotation.y=Math.sin(t*.7)*.12;
  }

  // Parpadeo aleatorio
  if(t>nextBlink&&blinkT<0){blinkT=t;nextBlink=t+1.5+Math.random()*3.5}
  let sy=1;if(blinkT>=0){const b=(t-blinkT)/.18;if(b>=1)blinkT=-1;else sy=1-Math.sin(b*Math.PI)*.95}
  eyes.forEach(e=>e.scale.y=sy*(1+V.brow*.2));

  // Consola: ondas
  [...wave.children].forEach((b,i)=>{b.style.height=(talk?4+Math.abs(Math.sin(t*14+i*.7))*22*(Math.sin(t*3+i)*.4+.6):3)+'px'});
  dot.style.background=talk?'#ff9f1c':'#34d399';

  // Colores de escenario
  cB.setHex(cfg.bg);cG.setHex(cfg.grid);cR.setHex(cfg.rim);const kc=1-Math.exp(-dt*2);
  S.background.lerp(cB,kc);S.fog.color.copy(S.background);S.fog.density+=(cfg.fog-S.fog.density)*kc;
  ground.material.color.copy(S.background).multiplyScalar(.82);
  grid.material.color.lerp(cG,kc);rim.color.lerp(cR,kc);
  for(const id in P){const p=P[id],act=id===cur;p.material.opacity+=((act?p.userData.op:0)-p.material.opacity)*kc;
    if(p.material.opacity>.01){const a=p.geometry.attributes.position.array;
      for(let i=0;i<a.length;i+=3){
        if(id==='plaza'){a[i+1]-=dt*.7;a[i]+=Math.sin(t+i)*dt*.6}
        else if(id==='parque'){a[i+1]+=dt*.8;a[i]+=Math.sin(t*1.3+i)*dt*.3}
        else{a[i]+=dt*.35;a[i+1]=Math.max(.3,Math.min(2.8,a[i+1]))}
        if(a[i+1]>9)a[i+1]=0;if(a[i+1]<0)a[i+1]=9;
        const c=p.userData.cx,s=p.userData.sp/2;if(a[i]>c+s)a[i]=c-s;if(a[i]<c-s)a[i]=c+s;
      }p.geometry.attributes.position.needsUpdate=true}}

  for(const id in BG){const m=BG[id].mesh.material;m.opacity+=((id===cur?1:0)-m.opacity)*kc;BG[id].mesh.visible=m.opacity>.01}

  // Luces siguen al tucán
  const X=T.position.x;
  key.position.set(X+6,12,8);key.target.position.set(X,0,0);
  rim.position.set(X-3,5,-8);rim.target.position.set(X,2,0);

  // Cámara con paneo y balanceo
  camX+=(X-camX)*(1-Math.exp(-dt*1.6));
  cam.position.set(camX+Math.sin(t*.3)*.4,mobile?3.8:3,mobile?17:8.5);
  cam.lookAt(camX+(X-camX)*.3,mobile?1.5:1.85,0);cam.rotateZ(THREE.MathUtils.clamp(-vel*.006,-.1,.1));

  // Burbuja sobre el tucán
  const v=new THREE.Vector3();H.getWorldPosition(v);v.y+=1;v.project(cam);
  const sx=THREE.MathUtils.clamp((v.x*.5+.5)*innerWidth,150,innerWidth-150),sy2=Math.max(110,(-v.y*.5+.5)*innerHeight);
  bub.style.left=sx+'px';bub.style.top=sy2+'px';

  R.render(S,cam);
}
loop();
</script>
